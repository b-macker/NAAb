[build-system]
requires = ["scikit-build-core>=0.5.0", "cmake>=3.15", "ninja"]
build-backend = "scikit_build_core.build"

[project]
name = "naab-governance"
version = "0.10.0"
description = "NAAb governance scanning for AI agent frameworks — static analysis via FFI"
requires-python = ">=3.8"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
keywords = ["governance", "security", "ai", "agent", "langchain", "crewai", "autogen", "static-analysis"]

[project.urls]
Homepage = "https://github.com/b-macker/NAAb"
Repository = "https://github.com/b-macker/NAAb"
Issues = "https://github.com/b-macker/NAAb/issues"

[tool.scikit-build]
cmake.build-type = "Release"
cmake.targets = ["naab_governance"]
wheel.packages = ["bindings/python"]
install.components = ["python_lib"]
