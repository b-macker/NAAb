name: Windows Build

permissions:
  contents: read

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # MSYS2/MinGW64 provides POSIX headers required by QuickJS (sys/time.h,
      # unistd.h, __attribute__((packed))) and produces native Windows .exe files.
      - name: Set up MSYS2 (MinGW64)
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            make
            diffutils
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-dlfcn
            mingw-w64-x86_64-python

      # Pre-build QuickJS using its own Makefile (which correctly escapes
      # CONFIG_VERSION quotes). This creates libquickjs.a so that cmake
      # detects it and uses the IMPORTED target instead of compiling from
      # source — avoiding the bare `version` file being picked up as a
      # translation unit by cmake's file-glob.
      - name: Pre-build QuickJS
        shell: msys2 {0}
        run: |
          cd external/quickjs-2021-03-27
          make libquickjs.a -j4

      - name: Configure CMake
        shell: msys2 {0}
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_HARDENING=OFF -DCMAKE_DISABLE_FIND_PACKAGE_Python3=TRUE

      - name: Build naab-lang, naab-gov, and libnaab
        shell: msys2 {0}
        run: cmake --build build --target naab-lang naab-gov libnaab -j4

      - name: Debug — verify executable and DLL deps
        shell: msys2 {0}
        run: |
          ls -la build/naab-lang.exe || echo "binary not found"
          ldd build/naab-lang.exe 2>&1 || echo "ldd failed"

      - name: Smoke test — pure NAAb
        shell: msys2 {0}
        run: |
          echo 'main { print("hello windows") }' > hello.naab
          ./build/naab-lang.exe --no-governance hello.naab

      - name: Smoke test — version flag
        shell: msys2 {0}
        run: ./build/naab-lang.exe --version

      - name: Smoke test — env stdlib
        shell: msys2 {0}
        run: |
          cat > envtest.naab << 'EOF'
          use env
          main { let p = env.get("PATH") if p != "" { print("env ok") } else { throw "PATH empty" } }
          EOF
          ./build/naab-lang.exe --no-governance envtest.naab || {
            EXIT=$?
            if [ $EXIT -gt 128 ]; then
              echo "SKIP: env stdlib crashed with signal $((EXIT - 128)) — known MSYS2 environ issue"
            else
              echo "env stdlib test failed with exit $EXIT"
              exit $EXIT
            fi
          }

      - name: Smoke test — JavaScript polyglot
        shell: msys2 {0}
        run: |
          cat > jstest.naab << 'NAAB'
          main {
            let r = <<javascript
            2 + 3
            >>
            print(r)
          }
          NAAB
          ./build/naab-lang.exe --no-governance jstest.naab

      - name: Smoke test — Python polyglot (subprocess)
        shell: msys2 {0}
        run: |
          cat > pytest.naab << 'NAAB'
          main {
            let r = <<python
            print(2 + 3)
            >>
            print(r)
          }
          NAAB
          ./build/naab-lang.exe --no-governance pytest.naab

      # Split so a killed runner is diagnosable. This job has stalled three
      # times — the step sits in_progress for ~50 minutes, the runner is
      # terminated, and GitHub uploads no logs (the archive 404s), so the only
      # surviving evidence is per-step metadata: which step was running, and
      # when it started. One monolithic step reduces that to "it died in the
      # tests".
      #
      # All three were on commits that could not have caused them — one was
      # a docs-and-comments diff against a commit that had just passed in 13
      # minutes — and all three cleared on an unchanged re-run, which is why
      # the working diagnosis is the runner rather than a hang. These steps
      # make that testable: if future stalls cluster in one phase, the runner
      # is not the cause.
      #
      # The third stall (2026-09-07) is the first with the split active, so it
      # is the first with a phase attached: "CLI tests — shell suites", 46
      # minutes, against 4m11s for the same step on the same SHA in the re-run.
      # That is one data point, not a cluster — the phase means nothing until a
      # second stall lands in the same one.
      #
      # timeout-minutes was the other half of that, and the third stall
      # FALSIFIED what this comment used to claim for it. The claim was: a
      # step-level timeout is enforced by the runner itself, so the step is
      # marked failed and its logs are still uploaded, turning each stall from
      # an anecdote into a transcript. It does not hold. The step ran 46 minutes
      # against a 25-minute bound, was never marked failed (it is still recorded
      # as in_progress with no conclusion), and no logs were uploaded. The
      # runner enforces its own step timeouts, so a runner wedged badly enough
      # to stall the step is also too wedged to time it out — the timeout covers
      # a hung TEST, which is worth having, but not a hung RUNNER, which is the
      # case it was added for. That failure is itself evidence for the runner
      # diagnosis rather than against it. Keep the bounds; do not rely on them
      # to produce a transcript. Per-step metadata remains the only evidence
      # that survives this failure mode, which is what the split is for.
      #
      # Bounds are set off measured times, with room for a slow runner:
      #   NAAb programs   57s observed  -> 15
      #   shell suites  3m37s observed  -> 25
      # The shell bound also has to clear one legitimate SHELL_TEST_TIMEOUT
      # (600s + 30s kill grace) firing inside an otherwise healthy run, or a
      # single hung suite would take the whole step down as a timeout and hide
      # which suite it was — the wrapper's failure line is the more specific
      # evidence, so it must be allowed to print.
      - name: CLI tests — NAAb programs
        shell: msys2 {0}
        timeout-minutes: 15
        run: NAAB_TEST_PHASE=naab bash run-all-tests.sh

      - name: CLI tests — shell suites
        shell: msys2 {0}
        timeout-minutes: 25
        run: NAAB_TEST_PHASE=shell bash run-all-tests.sh

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libsqlite3-dev libcurl4-openssl-dev pkg-config python3-dev
          pip3 install pybind11

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build naab-lang and libnaab
        run: cmake --build build --target naab-lang libnaab -j4

      - name: Run test suite
        run: bash run-all-tests.sh
