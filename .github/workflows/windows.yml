name: Windows Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_HARDENING=OFF

      - name: Build naab-lang
        run: cmake --build build --config Release --target naab-lang -j4

      - name: Smoke test — pure NAAb
        run: |
          echo 'main { print("hello windows") }' > hello.naab
          .\build\Release\naab-lang.exe hello.naab
        shell: pwsh

      - name: Smoke test — version flag
        run: .\build\Release\naab-lang.exe --version
        shell: pwsh

      - name: Smoke test — env stdlib
        run: |
          $script = 'use env` main { let p = env.get("PATH") if p != "" { print("env ok") } else { throw "PATH empty" } }'
          $script | Out-File -Encoding utf8 envtest.naab
          .\build\Release\naab-lang.exe envtest.naab
        shell: pwsh

      - name: CLI tests (via Git Bash)
        run: bash run-all-tests.sh
        shell: bash

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libsqlite3-dev libcurl4-openssl-dev pkg-config

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build naab-lang
        run: cmake --build build --target naab-lang -j4

      - name: Run test suite
        run: bash run-all-tests.sh
