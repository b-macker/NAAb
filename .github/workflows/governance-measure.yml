name: Governance measurement (nightly, report only)

# Bundle 13: what the block checks catch, against labels made outside this
# repository (NIST Juliet; EvalPlus solutions judged by their hidden tests).
# Report only: the job publishes a report and fails only when the instrument
# is broken (a control fails, a dataset's hash does not match its pin) --
# never on a rate. Not on pull requests: the datasets are large, downloaded
# at run time and never committed, and labelling runs model-written code,
# which belongs on a throwaway runner.
#
# LICENCE: the Semgrep rules repository (fetched below, pinned to a commit) is
# under the Semgrep Rules License v1.0 -- internal use only, no
# redistribution. Its checkout and the cases built from it stay under
# $RUNNER_TEMP. Nothing from them may be written under measure/, which is
# uploaded: reports there carry counts and NAAb's own rule names only.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  measure:
    name: Measure what the block checks catch
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libsqlite3-dev \
            python3-dev \
            libssl-dev \
            libffi-dev \
            libcurl4-openssl-dev \
            pkg-config
          pip3 install pybind11

      - name: Build naab-gov and naab-lang
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja
          ninja -C build naab-gov naab-lang -j$(nproc)

      - name: Instrument self-tests
        run: bash tests/self-audit/test_govmeasure.sh

      - name: Fetch the datasets (pinned by SHA-256, or by commit)
        run: python3 tools/govmeasure/datasets.py fetch "$RUNNER_TEMP/datasets"

      - name: Build the cases
        run: |
          D="$RUNNER_TEMP/datasets"
          mkdir -p measure
          python3 tools/govmeasure/juliet.py cases --zip "$D/juliet-cpp-1.3.zip" \
            --out "$RUNNER_TEMP/juliet.jsonl" | tee measure/juliet-cases.txt
          # Runs model-written code, each solution in a limited child process.
          python3 tools/govmeasure/evalplus.py cases --tests "$D/humanevalplus-0.1.10.jsonl.gz" \
            --samples "$D"/evalplus-samples-*.zip --out "$RUNNER_TEMP/evalplus.jsonl" \
            --labels measure/evalplus-labels.tsv --jobs "$(nproc)" | tee measure/evalplus-cases.txt
          # Counts per language only; the cases file stays in RUNNER_TEMP (licence, above).
          python3 tools/govmeasure/semgrep_tests.py cases --repo "$D/semgrep-rules" \
            --out "$RUNNER_TEMP/semgrep.jsonl" | grep -v '^wrote ' | tee measure/semgrep-cases.txt
          # The second profile: the config a new project starts with.
          mkdir -p "$RUNNER_TEMP/init" && (cd "$RUNNER_TEMP/init" && "$GITHUB_WORKSPACE/build/naab-lang" init >/dev/null)
          test -s "$RUNNER_TEMP/init/govern.json"
          python3 - "$RUNNER_TEMP/semgrep.jsonl" "$RUNNER_TEMP/semgrep-pysh.jsonl" <<'PYEOF'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as src, open(sys.argv[2], "w", encoding="utf-8", newline="\n") as dst:
              for line in src:
                  if json.loads(line)["language"] in ("python", "shell"):
                      dst.write(line)
          PYEOF

      - name: Score (exit 2 = UNMEASURABLE; a rate never fails the job)
        run: |
          python3 tools/govmeasure/govmeasure.py score "$RUNNER_TEMP/juliet.jsonl" \
            --jobs "$(nproc)" --title "Juliet C/C++ 1.3 at $GITHUB_SHA" \
            --json measure/juliet.json --md measure/juliet.md
          python3 tools/govmeasure/govmeasure.py score "$RUNNER_TEMP/evalplus.jsonl" \
            --jobs "$(nproc)" --title "EvalPlus solutions at $GITHUB_SHA" \
            --json measure/evalplus.json --md measure/evalplus.md
          python3 tools/govmeasure/govmeasure.py score "$RUNNER_TEMP/semgrep.jsonl" --group source \
            --jobs "$(nproc)" --title "Semgrep test files by language at $GITHUB_SHA" \
            --json measure/semgrep-by-language.json --md measure/semgrep-by-language.md
          python3 tools/govmeasure/govmeasure.py score "$RUNNER_TEMP/semgrep.jsonl" --group category \
            --jobs "$(nproc)" --title "Semgrep test files by CWE at $GITHUB_SHA" \
            --json measure/semgrep-by-cwe.json --md measure/semgrep-by-cwe.md
          # The init profile has hard-level checks (a hard block ends the scan)
          # and allows only Python and shell: any-rule totals, those languages.
          I="$RUNNER_TEMP/init/govern.json"
          python3 tools/govmeasure/govmeasure.py score "$RUNNER_TEMP/evalplus.jsonl" --config "$I" --any-rule-only \
            --jobs "$(nproc)" --title "EvalPlus solutions, init profile, at $GITHUB_SHA" \
            --json measure/evalplus-init.json --md measure/evalplus-init.md
          python3 tools/govmeasure/govmeasure.py score "$RUNNER_TEMP/semgrep-pysh.jsonl" --config "$I" --any-rule-only \
            --group source --jobs "$(nproc)" --title "Semgrep Python and shell, init profile, at $GITHUB_SHA" \
            --json measure/semgrep-init.json --md measure/semgrep-init.md
          python3 tools/govmeasure/naab_lint.py measure --jobs "$(nproc)" \
            --title "The lint-only checks on NAAb text at $GITHUB_SHA" \
            --json measure/naab-lint.json --md measure/naab-lint.md
          cat measure/juliet.md measure/evalplus.md measure/semgrep-by-language.md measure/naab-lint.md >> "$GITHUB_STEP_SUMMARY"

      - name: Nothing from the Semgrep checkout is in the upload
        run: |
          # The cases carry Semgrep's code under a "code" key; no file under
          # measure/ may hold one, and none may be a cases file.
          if grep -rlE '"code"[[:space:]]*:' measure/ ; then
            echo "a file under measure/ holds case code: refusing to upload" >&2
            exit 1
          fi
          ! ls measure/ | grep -E 'semgrep.*\.jsonl$'

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governance-measurement
          path: measure/
          if-no-files-found: warn
