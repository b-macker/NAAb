name: Gate Mutation Sweep

# MANUAL ONLY, and that is a judgement rather than an oversight.
#
# This answers "would any test notice if this governance gate stopped working?"
# by neutering one gate, rebuilding, and seeing whether anything fails. It is
# an audit instrument aimed at the test suite, not a gate protecting behaviour,
# so it does not belong on push and does not belong on a nightly schedule:
#
#   * 99 gates, of which 76 are mentioned in no test file. A mentioned gate
#     resolves in well under a minute; an unmentioned one needs a full
#     run-all-tests.sh (~15 min) to reach a verdict.
#   * scope=mentioned is ~1 job-hour and tests a FALSIFIABLE claim -- that a
#     test really witnesses the gate it names. That is the half worth running.
#   * scope=unmentioned is ~19 job-hours. Its verdict is close to foregone and
#     the free `--list-gates --filter unmentioned` already names the gates, so
#     running it nightly would burn a working day of CI to confirm a list you
#     can print in a second.
#
# Trigger it from the Actions tab, walk away, read the run summary later.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which gates to probe'
        required: true
        default: 'mentioned'
        type: choice
        options: [mentioned, unmentioned, all]
      shards:
        description: 'Parallel shards (1 is fine for "mentioned"; use 8+ for "unmentioned")'
        required: true
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  plan:
    name: Plan shards
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      gates: ${{ steps.plan.outputs.gates }}
    steps:
      - uses: actions/checkout@v4

      - id: plan
        name: Enumerate gates and build the shard matrix
        run: |
          set -euo pipefail
          # The gate list comes from the harness itself. Re-implementing the
          # enumeration here would be a SECOND definition of "what is a gate",
          # free to drift from the one that does the probing.
          N=$(bash tests/self-audit/test_gate_mutation.sh \
                --list-gates --filter "${{ inputs.scope }}" | wc -l)
          echo "gates=$N" >> "$GITHUB_OUTPUT"
          S="${{ inputs.shards }}"
          case "$S" in ''|*[!0-9]*) echo "shards must be a positive integer"; exit 1;; esac
          [ "$S" -ge 1 ] || { echo "shards must be >= 1"; exit 1; }
          [ "$N" -gt 0 ] || { echo "no gates selected for scope=${{ inputs.scope }}"; exit 1; }
          # Never more shards than gates, or the extra jobs do a full build to
          # probe nothing and the run looks half-empty for no reason.
          [ "$S" -gt "$N" ] && S="$N"
          echo "matrix=$(seq 1 "$S" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          echo "### Plan" >> "$GITHUB_STEP_SUMMARY"
          echo "scope \`${{ inputs.scope }}\` — **$N gates** across **$S shard(s)**" >> "$GITHUB_STEP_SUMMARY"

  probe:
    name: "Probe (shard ${{ matrix.shard }})"
    needs: plan
    runs-on: ubuntu-latest
    # Unmentioned gates cost ~15 min each. GitHub's ceiling is 360; this leaves
    # margin for the setup build without silently truncating a shard.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The harness probes in a throwaway `git worktree`, and a worktree
          # checks out TRACKED FILES ONLY -- submodules come up empty and cmake
          # dies on external/abseil-cpp. It re-inits them inside the worktree
          # from .git/modules, which only works if they were fetched here first.
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build libsqlite3-dev python3-dev \
            libssl-dev libffi-dev libcurl4-openssl-dev pkg-config
          pip3 install pybind11

      # No build step: the harness configures and builds inside its own
      # worktree and never reads the main build/, so building here would be
      # six wasted minutes per shard.

      - name: Probe this shard
        run: |
          set -uo pipefail
          GATES=$(bash tests/self-audit/test_gate_mutation.sh \
                    --list-gates --filter "${{ inputs.scope }}" \
                    --shard "${{ matrix.shard }}" --shards "${{ strategy.job-total }}" \
                  | tr '\n' ' ')
          echo "shard ${{ matrix.shard }} gates: $GATES"
          [ -n "${GATES// /}" ] || { echo "empty shard, nothing to do"; exit 0; }
          bash tests/self-audit/test_gate_mutation.sh --gate "$GATES" 2>&1 | tee probe.log

      - name: Stage this shard's verdicts
        if: always()
        run: |
          mkdir -p out
          # Only THIS run's verdicts. The committed ledger may already carry
          # rows from earlier runs, and shipping those back as if this shard
          # produced them would inflate the merged result with stale evidence.
          if [ -f tests/self-audit/gate_mutation_ledger.txt ]; then
            git diff --no-color -- tests/self-audit/gate_mutation_ledger.txt \
              | sed -n 's/^+\([^+]\)/\1/p' > "out/ledger-${{ matrix.shard }}.txt" || true
          fi
          cp probe.log "out/probe-${{ matrix.shard }}.log" 2>/dev/null || true
          wc -l < "out/ledger-${{ matrix.shard }}.txt" 2>/dev/null || echo 0

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-mutation-shard-${{ matrix.shard }}
          path: out/
          if-no-files-found: ignore

  report:
    name: Merge and report
    needs: [plan, probe]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          pattern: gate-mutation-shard-*
          merge-multiple: true
          path: shards

      - name: Merge ledgers and write the summary
        run: |
          set -uo pipefail
          cat shards/ledger-*.txt 2>/dev/null | sort -u > merged-ledger.txt || true
          TOT=$(wc -l < merged-ledger.txt || echo 0)
          UNP=$(awk '$2=="UNPROTECTED"' merged-ledger.txt | wc -l || echo 0)
          PRO=$(awk '$2=="PROTECTED"'   merged-ledger.txt | wc -l || echo 0)
          {
            echo "## Gate mutation — scope \`${{ inputs.scope }}\`"
            echo ""
            echo "**$TOT probed** · ✅ $PRO protected · ❌ $UNP unprotected"
            echo ""
            echo "A gate is UNPROTECTED when neutering it broke no test. That is"
            echo "**not** proof the gate is inert — it is proof CI would not tell"
            echo "you if it were."
            echo ""
            if [ "$UNP" -gt 0 ]; then
              echo "### Unprotected"
              echo ""
              echo "| gate |"
              echo "|---|"
              awk '$2=="UNPROTECTED"{print "| `" $1 "` |"}' merged-ledger.txt
              echo ""
            fi
            if [ "$PRO" -gt 0 ]; then
              echo "<details><summary>Protected ($PRO) — with witness</summary>"
              echo ""
              echo "| gate | witness |"
              echo "|---|---|"
              awk '$2=="PROTECTED"{print "| `" $1 "` | `" $3 "` |"}' merged-ledger.txt
              echo ""
              echo "</details>"
            fi
            if [ "$TOT" -eq 0 ]; then
              echo "No verdicts were produced. Check the shard logs — the harness"
              echo "refuses to report rather than emit verdicts it cannot support,"
              echo "so an empty result is a real signal, not an absence of one."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged ledger
        uses: actions/upload-artifact@v4
        with:
          name: gate-mutation-ledger
          path: merged-ledger.txt
          if-no-files-found: ignore
