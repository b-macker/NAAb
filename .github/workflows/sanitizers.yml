name: Sanitizers

permissions:
  contents: read

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test-sanitizers:
    name: Test with ${{ matrix.sanitizer }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [asan, ubsan]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            libsqlite3-dev \
            python3-dev \
            libssl-dev \
            libffi-dev \
            libcurl4-openssl-dev \
            pkg-config

      - name: Build with ${{ matrix.sanitizer }}
        env:
          CC: clang
          CXX: clang++
        run: |
          mkdir -p build-${{ matrix.sanitizer }}
          cd build-${{ matrix.sanitizer }}
          cmake .. \
            -DENABLE_$(echo ${{ matrix.sanitizer }} | tr '[:lower:]' '[:upper:]')=ON \
            -DCMAKE_BUILD_TYPE=Debug \
            -G Ninja
          ninja naab-lang -j$(nproc)

      - name: Run tests with ${{ matrix.sanitizer }}
        run: |
          NAAB=build-${{ matrix.sanitizer }}/naab-lang
          if [ ! -f "$NAAB" ]; then
            echo "Binary not found"
            exit 1
          fi

          PASS=0
          FAIL=0
          for test_file in tests/test_match.naab tests/test_async.naab tests/test_go_executor.naab; do
            if [ -f "$test_file" ]; then
              echo "=== Testing: $test_file ==="
              if timeout 60 ./$NAAB "$test_file" 2>&1; then
                PASS=$((PASS + 1))
              else
                echo "FAILED: $test_file"
                FAIL=$((FAIL + 1))
              fi
            fi
          done

          echo ""
          echo "Results: $PASS passed, $FAIL failed"
          if [ $FAIL -gt 0 ]; then
            exit 1
          fi

  # ThreadSanitizer over the concurrency suites (Bundle 9): agent.batch tools
  # (A93), report writers beside recording threads (A86), the collector beside
  # another engine (A92), the async VM's governance state (A65). The runner,
  # its positive control and the suite list are tests/tsan/run_tsan.sh; a report
  # fails the job unless tests/tsan/suppressions.txt gives a reason for it.
  test-tsan:
    name: ThreadSanitizer (concurrency suites)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            libsqlite3-dev \
            python3-dev \
            python3-pip \
            libssl-dev \
            libffi-dev \
            libcurl4-openssl-dev \
            pkg-config
          pip3 install pybind11

      - name: Build naab-lang and the unit tests with ThreadSanitizer
        env:
          CC: clang
          CXX: clang++
        run: |
          # Into build/, because every suite takes its binary from there.
          cmake -S . -B build -DENABLE_TSAN=ON -DCMAKE_BUILD_TYPE=RelWithDebInfo -G Ninja
          ninja -C build naab-lang naab_unit_tests -j$(nproc)

      - name: Let ThreadSanitizer map its shadow memory
        run: |
          # Ubuntu 24.04 runners randomise mmap with 32 bits, where TSan cannot
          # start ("unexpected memory mapping"); 28 is the value it supports.
          sudo sysctl -w vm.mmap_rnd_bits=28

      - name: Run the concurrency suites under ThreadSanitizer
        env:
          CXX: clang++
        run: bash tests/tsan/run_tsan.sh
