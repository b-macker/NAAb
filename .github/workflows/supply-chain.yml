name: Supply Chain Security

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  # Manual trigger; gitleaks-action treats this like schedule (full-history scan)
  workflow_dispatch:

# Scans only. Signing, the SBOM and the provenance file a release carries are
# made and published by release.yml (A180): this workflow used to create and
# publish the release page itself, seconds after a v* tag, before release.yml's
# notes and packages existed. It may not write contents, so it cannot again.
permissions:
  contents: read
  security-events: write  # For uploading SARIF results

jobs:
  # ==========================================================================
  # Job 1: Secret Scanning
  # ==========================================================================
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comprehensive scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Pin the scanner version (the action's default is 8.24.3 baked into
          # its pinned commit). .gitleaksignore fingerprints were generated
          # with this exact version — regenerate them if this pin changes.
          GITLEAKS_VERSION: "8.30.1"

      - name: Upload Gitleaks SARIF
        # Upload on green runs too: gitleaks writes a zero-result SARIF when
        # clean, and code scanning only auto-closes open alerts when a newer
        # analysis of the same category omits them. Upload-on-failure-only
        # left the alerts from the historical full-history scan failures
        # open with nothing to ever close them.
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3
        with:
          sarif_file: results.sarif

  # ==========================================================================
  # Job 2: Dependency Check
  # ==========================================================================
  dependency-check:
    name: Dependency Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify DEPENDENCIES.lock exists
        run: |
          if [ ! -f DEPENDENCIES.lock ]; then
            echo "Error: DEPENDENCIES.lock not found"
            echo "Run: scripts/generate-dependency-lock.sh"
            exit 1
          fi
          echo "✓ DEPENDENCIES.lock found"

      - name: Check for dependency changes
        run: |
          # This would compare current dependencies with lockfile
          # For now, just verify the lockfile is valid
          grep -q "version: 1" DEPENDENCIES.lock
          echo "✓ Dependency lockfile is valid"

  # ==========================================================================
  # Job 3: SBOM Generation
  # ==========================================================================
  sbom-generate:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate SBOM
        run: |
          chmod +x scripts/generate-sbom.sh
          ./scripts/generate-sbom.sh

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom/naab-sbom.spdx.json
            sbom/naab-sbom.cdx.json
            sbom/naab-sbom.txt

  # ==========================================================================
  # Job 4: Vulnerability Scanning (using SBOM)
  # ==========================================================================
  vulnerability-scan:
    name: Vulnerability Scanning
    runs-on: ubuntu-latest
    needs: sbom-generate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: sbom/

      - name: Scan for vulnerabilities with Grype
        uses: anchore/scan-action@869c549e657a088dc0441b08ce4fc0ecdac2bb65 # v5
        env:
          GRYPE_DB_AUTO_UPDATE: "true"
          GRYPE_DB_MAX_ALLOWED_BUILT_AGE: 168h
        with:
          sbom: sbom/naab-sbom.spdx.json
          fail-build: true
          severity-cutoff: high

      - name: Upload vulnerability report
        if: always()
        uses: github/codeql-action/upload-sarif@411c4c9a36b3fca4d674f06b6396b2c6d23522c6 # v3
        with:
          sarif_file: results.sarif

  # ==========================================================================
  # Job 5: License Compliance Check
  # ==========================================================================
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check licenses
        run: |
          # Verify all dependencies have acceptable licenses
          # This is a simple check; could use tools like licensee or FOSSology
          echo "Checking dependency licenses..."

          # Check for GPL licenses (uncompatible with Apache-2.0)
          if grep -r "GPL" external/ --include="LICENSE" --include="COPYING"; then
            echo "Warning: GPL dependencies found"
            echo "Verify compatibility with project license"
          fi

          echo "✓ License check complete"

  # ==========================================================================
  # Job 6: Supply Chain Summary
  # ==========================================================================
  summary:
    name: Supply Chain Summary
    runs-on: ubuntu-latest
    needs: [secret-scan, dependency-check, sbom-generate, vulnerability-scan]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "# Supply Chain Security Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Status" >> $GITHUB_STEP_SUMMARY
          echo "- Secret Scanning: ${{ needs.secret-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency Check: ${{ needs.dependency-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- SBOM Generation: ${{ needs.sbom-generate.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Vulnerability Scan: ${{ needs.vulnerability-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Security Features" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dependency lockfile (DEPENDENCIES.lock)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ SBOM generation (SPDX + CycloneDX)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Artifact signing (cosign), in release.yml on a v* tag" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Secret scanning (gitleaks)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Vulnerability scanning (Grype)" >> $GITHUB_STEP_SUMMARY
