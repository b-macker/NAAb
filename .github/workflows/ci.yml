name: CI

permissions:
  contents: read

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            libsqlite3-dev \
            python3-dev \
            libssl-dev \
            libffi-dev \
            libcurl4-openssl-dev \
            pkg-config
          pip3 install pybind11

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja
          # naab-verify-audit is the ONLY verifier for the tamper-evident audit
          # log. It is a declared executable that no workflow built, so it rotted
          # unnoticed: on 18dbada it failed to compile (std::filesystem used with
          # no <filesystem> include). An unbuilt target reads as a shipped
          # feature -- the same failure register B10 records for unrun tests, one
          # layer down. tests/security/test_audit_hmac_required.sh needs this
          # binary and reports UNMEASURABLE rather than passing without it.
          ninja -C build naab-lang libnaab naab-verify-audit -j$(nproc)

      - name: Run tests
        run: bash run-all-tests.sh

  # Run the suite as a NON-ROOT user.
  #
  # Root masks every permission-shaped portability bug, and that is not
  # hypothetical here: dozens of scripts defaulted their temp directory to
  # /data/data/com.termux/files/usr/tmp, and as root a plain mkdir -p CREATED
  # that tree on an ordinary Linux box. The suite then went green because it was
  # privileged, while a normal user got hard failures -- and the phantom
  # directory went on to flip libnaab-governance from SHARED to STATIC at the
  # next configure. Every runner in this file is root, so nothing caught it.
  #
  # This job is the missing control. It does not need to run everything: the
  # failure mode is "a script cannot create its work directory", which surfaces
  # in the first suites that try.
  build-and-test-nonroot:
    name: Build & Test (non-root)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build libsqlite3-dev python3-dev \
            libssl-dev libffi-dev libcurl4-openssl-dev pkg-config
          pip3 install pybind11

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja
          ninja -C build naab-lang libnaab naab-verify-audit -j$(nproc)

      - name: Assert the phantom Termux tree was not created by the build
        run: |
          if [ -e /data/data/com.termux ]; then
            echo "FAIL: /data/data/com.termux exists -- something re-introduced it" >&2
            exit 1
          fi
          echo "OK: no phantom Termux tree"

      - name: Run tests as a non-root user
        run: |
          set -euo pipefail
          sudo useradd -m naabtest

          # COPY the tree rather than chown the checkout. Re-owning
          # $GITHUB_WORKSPACE takes .git with it, and the runner's post-job
          # cleanup then cannot write .git/config ("could not lock config
          # file: Permission denied"), which fails the job for a reason that
          # has nothing to do with the tests and buries the result we came for.
          WORK=/home/naabtest/naab
          sudo cp -a "$GITHUB_WORKSPACE" "$WORK"
          sudo chown -R naabtest:naabtest "$WORK"

          # HOME must be the test user's: several suites write under $HOME, and
          # leaving root's HOME set is another way to run "as non-root" while
          # still exercising a privileged path.
          # Ratchet, not a pass/fail gate, and deliberately so. Converting the
          # temp-path handling took the non-root failure count from 125 to 7,
          # and 2 of those 7 fail as root too. The other 5 are genuine
          # root-only suites that predate this change:
          #
          #   test_go_executor.naab          test_sandbox_engine_parity.sh
          #   test_sandbox_level_precedence.sh   test_python_audit_hook.sh
          #   test_default_patterns.sh
          #
          # Failing the job on those would mean shipping red; allowlisting them
          # by name would go stale silently. A count ceiling is what CV-01 and
          # CV-02 already do for the same shape of problem: it cannot regress
          # without someone noticing, and it drops as each one is fixed.
          set +e
          sudo -u naabtest env "PATH=$PATH" HOME=/home/naabtest \
            bash -c "cd '$WORK' && bash run-all-tests.sh" | tee /tmp/nonroot.log
          set -e

          N=$(grep -aoE 'Unexpected fails:[[:space:]]*[0-9]+' /tmp/nonroot.log \
                | tail -1 | grep -oE '[0-9]+')
          if [ -z "$N" ]; then
            echo "UNMEASURABLE: the suite printed no 'Unexpected fails:' line." >&2
            echo "That is a broken probe, not a pass -- failing rather than" >&2
            echo "reporting a ceiling nothing was measured against." >&2
            exit 1
          fi
          echo "non-root unexpected failures: $N (ceiling 7)"
          [ "$N" -le 7 ] || { echo "REGRESSION: non-root failures rose to $N" >&2; exit 1; }

      - name: Confirm the run really was unprivileged
        run: |
          # A job that silently ran as root would pass every assertion here for
          # the wrong reason, which is the failure mode this whole PR is about.
          test "$(sudo -u naabtest id -u)" -ne 0
          echo "OK: test user is uid $(sudo -u naabtest id -u)"

      - name: Assert the suite still did not create it
        if: always()
        run: |
          if [ -e /data/data/com.termux ]; then
            echo "FAIL: the test run created /data/data/com.termux" >&2
            exit 1
          fi
          echo "OK: suite left no phantom tree"

  build-msvc:
    name: MSVC Build Check
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies via vcpkg
        run: vcpkg install sqlite3 openssl curl --triplet x64-windows

      - name: Build with MSVC
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja ^
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake ^
            -DENABLE_HARDENING=OFF ^
            -DCMAKE_DISABLE_FIND_PACKAGE_Python3=TRUE
          ninja -C build naab-lang naab-gov -j%NUMBER_OF_PROCESSORS%

  vscode-extension:
    name: VS Code Extension Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: vscode-naab
        run: npm ci

      - name: Compile extension
        working-directory: vscode-naab
        run: npm run compile
